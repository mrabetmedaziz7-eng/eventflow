spring:
  application:
    name: eventflow-backend
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

server:
  port: 2525

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      discovery:
        enabled: false

app:
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
