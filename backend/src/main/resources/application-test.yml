spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventflow_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true

app:
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@example.com}
      password: ${ADMIN_PASSWORD:admin12345678}
  jwt:
    # Dev-only secret for local development and testing
    secret: ${JWT_SECRET:c29tZS12ZXJ5LXNlY3VyZS1hbmQtbG9uZy1qd3Qtc2VjcmV0LWtleS0yNTYtYml0cw==}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  payment:
    api-key: ${PAYMENT_API_KEY:}
    secret-key: ${PAYMENT_SECRET_KEY:}
