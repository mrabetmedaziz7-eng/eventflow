name: eventflow-staging

services:
  db:
    image: postgres:17-alpine
    env_file:
      - path: .env.staging
        required: false
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - eventflow-staging-net
    restart: unless-stopped

  backend:
    image: ghcr.io/mrabetmedaziz7-eng/eventflow-backend:${IMAGE_TAG:?IMAGE_TAG est obligatoire}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.staging
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:${STAGING_PORT:-8081}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2525/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - eventflow-staging-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/mrabetmedaziz7-eng/eventflow-frontend:${IMAGE_TAG:?IMAGE_TAG est obligatoire}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - eventflow-staging-net
    restart: unless-stopped

  proxy:
    image: ghcr.io/mrabetmedaziz7-eng/eventflow-proxy:${IMAGE_TAG:?IMAGE_TAG est obligatoire}
    ports:
      - "${STAGING_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - eventflow-staging-net
    restart: unless-stopped

volumes:
  pgdata_staging:

networks:
  eventflow-staging-net:
    driver: bridge
